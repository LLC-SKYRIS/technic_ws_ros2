<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<title>ROS Topics</title>
	<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
	<link rel="icon" href="data:,">
	<script src="js/roslib.js"></script>
  <script src="js/ros2_compat.js"></script>
	<script type="module" src="js/topics.js"></script>
	<script src="js/yaml.js"></script>
	<style>
		:root{
			--bg:#0c0c0e;
			--panel:#1b1c1f;
			--panel-2:#222327;
			--text:#e7e7ea;
			--muted:#a8abb3;
			--accent:#2ea0ff;
			--shadow:0 6px 18px rgba(0,0,0,.35);
			--radius:18px;
			--space: clamp(10px, 2vw, 18px);
		}
		* { box-sizing: border-box; margin: 0; padding: 0; }
		html, body { height: 100%; }
		body {
			background: var(--bg);
			color: var(--text);
			font: 15px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu;
			overflow: hidden;
			touch-action: manipulation;
		}
		body.closed { background: #161618; }
		/* Страница — один экран: шапка всегда видна, длинный список топиков
		   или сообщение прокручиваются внутри своей области. */
		.wrap {
			height: 100vh;
			height: 100dvh;
			width: min(1600px, 100%);
			margin: 0 auto;
			display: flex;
			flex-direction: column;
			gap: var(--space);
			padding:
				calc(var(--space) + env(safe-area-inset-top))
				calc(clamp(10px, 2vw, 28px) + env(safe-area-inset-right))
				calc(var(--space) + env(safe-area-inset-bottom))
				calc(clamp(10px, 2vw, 28px) + env(safe-area-inset-left));
		}
		header {
			flex: 0 0 auto;
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 4px;
			width: 100%;
			gap: 12px;
		}
		h1 {
			margin: 0;
			font-size: clamp(16px, 2vw, 22px);
			font-weight: 500;
			color: var(--muted);
			word-break: break-word;
		}
		h1 a {
			color: var(--accent);
			text-decoration: none;
			font-weight: 500;
		}
		h1 a:hover { text-decoration: underline; }
		#topic-type {
			font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
			font-size: 0.7em;
			vertical-align: super;
			font-weight: normal;
		}
		.header-link {
			color: var(--accent);
			text-decoration: none;
			font-weight: 500;
			white-space: nowrap;
			flex: 0 0 auto;
		}
		.header-link:hover { text-decoration: underline; }

		#topics {
			flex: 1 1 auto;
			min-height: 0;
			overflow: auto;
			list-style: none;
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr));
			align-content: start;
			gap: 8px;
			width: 100%;
			padding: 2px;
		}
		#topics:empty { display: none; }
		#topics li { min-width: 0; }
		.topic { overflow-wrap: anywhere; }
		.topic {
			display: block;
			font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
			font-size: 13px;
			background: var(--panel);
			color: var(--text);
			padding: 12px 14px;
			border-radius: var(--radius);
			box-shadow: var(--shadow);
			text-decoration: none;
			transition: transform .15s ease, background .2s ease;
		}
		.topic:hover {
			transform: translateY(-1px);
			background: var(--panel-2);
		}
		#topics li {
			color: var(--muted);
		}

		#topic-message {
			display: none;
			white-space: pre-wrap;
			word-break: break-word;
			font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
			font-size: 13px;
			line-height: 1.45;
			background: var(--panel);
			color: var(--text);
			padding: clamp(12px, 2vw, 16px);
			border-radius: var(--radius);
			box-shadow: var(--shadow);
			width: 100%;
			flex: 1 1 auto;
			min-height: 0;
			overflow: auto;
		}
		.counter {
			color: var(--muted);
			margin-bottom: 1em;
			font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu;
			font-size: 13px;
		}

		@media (max-width: 768px) {
			:root { --space: 6px; }
			body { font-size: 13px; }
			.wrap {
				width: 100%;
				padding:
					calc(6px + env(safe-area-inset-top))
					calc(6px + env(safe-area-inset-right))
					calc(6px + env(safe-area-inset-bottom))
					calc(6px + env(safe-area-inset-left));
				gap: 6px;
			}
			header {
				align-items: flex-start;
				margin-bottom: 0;
			}
			h1 { font-size: 14px; }
			.header-link { font-size: 12px; }
			#topics { grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr)); }
			.topic {
				padding: 10px 12px;
				font-size: 12px;
				border-radius: 14px;
			}
			#topics { gap: 6px; }
			#topic-message {
				padding: 10px 12px;
				font-size: 12px;
				border-radius: 14px;
			}
			.counter { font-size: 11px; }
		}

		@media (max-height: 520px) and (orientation: landscape) {
			.wrap {
				padding:
					calc(4px + env(safe-area-inset-top))
					calc(6px + env(safe-area-inset-right))
					calc(4px + env(safe-area-inset-bottom))
					calc(6px + env(safe-area-inset-left));
				gap: 4px;
			}
			header { margin-bottom: 0; }
			h1 { font-size: 12px; }
			.header-link { font-size: 10px; }
			.topic {
				padding: 8px 10px;
				font-size: 11px;
				border-radius: 12px;
			}
			#topics { gap: 4px; }
			#topic-message {
				padding: 8px 10px;
				font-size: 11px;
			}
			.counter { font-size: 10px; }
		}
	</style>
</head>
<body>
	<div class="wrap">
		<header>
			<div>
				<h1>ROS Topics</h1>
			</div>
			<a href="index.html" class="header-link">← На главную</a>
		</header>

		<ul id="topics"></ul>
		<code id="topic-message">No messages received</code>
	</div>

	<script>
		document.addEventListener('gesturestart', (event) => event.preventDefault(), { passive: false });
		document.addEventListener('gesturechange', (event) => event.preventDefault(), { passive: false });
		let lastTouchEnd = 0;
		document.addEventListener('touchend', (event) => {
			const now = Date.now();
			if (now - lastTouchEnd <= 300) {
				event.preventDefault();
			}
			lastTouchEnd = now;
		}, { passive: false });
	</script>
</body>
</html>
